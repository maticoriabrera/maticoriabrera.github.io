<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faf6">
  <meta name="description" content="Consulta tu plan alimentario semanal, preparaciones y alternativas en español e italiano.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Mi plan alimentario</title>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none"><path d="M11 29.5c9.5-1 17.9-8.6 21.5-20 5.5 12.5-1.2 25.7-12.1 25.7-6.6 0-10.4-2.2-9.4-5.7Z" fill="#D2E6D0" stroke="#356D57" stroke-width="1.8"/><path d="M13 31C19 25 24 19.5 31 13" stroke="#356D57" stroke-width="2" stroke-linecap="round"/><path d="M21 24.5 18.5 20m7.5-1.4-1.2-4.4" stroke="#356D57" stroke-width="1.7" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-copy"><span class="brand-name" id="brand-name">Mi plan</span><span class="brand-sub" id="brand-sub">Alimentación sencilla, cada día</span></div>
      </div>
      <div class="lang-switch" role="group" aria-label="Idioma / Lingua">
        <button type="button" data-lang="es" aria-pressed="true">ES</button><span aria-hidden="true"></span><button type="button" data-lang="it" aria-pressed="false">IT</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <div class="loading-state" role="status">Cargando tu plan alimentario…</div>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-view="day" type="button" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M4 9.5h16M8 14h3M8 17.5h6"/></svg><span id="nav-day">Día</span></button>
      <button class="nav-item" data-view="week" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="17" rx="3"/><path d="M7.5 2v4M16.5 2v4M3.5 9.5h17M8 13.5h2M14 13.5h2M8 17h2M14 17h2"/></svg><span id="nav-week">Semana</span></button>
      <button class="nav-item" data-view="recipes" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M18 3v18M18 3c-4 3-5 8-1 10h1"/></svg><span id="nav-recipes">Preparaciones</span></button>
      <button class="nav-item" data-view="foods" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21c-5-4-8.5-7.5-8.5-12A5.5 5.5 0 0 1 12 4.6 5.5 5.5 0 0 1 20.5 9c0 4.5-3.5 8-8.5 12Z"/><path d="M12 5c-1-2-.5-3 1-4m-1 9c1.5-2 3.3-3 5-3"/></svg><span id="nav-foods">Alimentos</span></button>
    </nav>
  </div>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner"><div class="dialog-top"><div><span id="dialog-kicker" class="eyebrow"></span><h2 id="dialog-title"></h2></div><div class="dialog-actions"><div class="lang-switch dialog-lang" role="group" aria-label="Idioma / Lingua"><button type="button" data-lang="es" aria-pressed="true">ES</button><span aria-hidden="true"></span><button type="button" data-lang="it" aria-pressed="false">IT</button></div><button class="icon-button" id="dialog-close" type="button" aria-label="Cerrar">✕</button></div></div><div id="dialog-content"></div></div>
  </dialog>
  <div class="sr-only" id="status-announcer" role="status" aria-live="polite"></div>
</body>
</html>
